{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="{{url_for('static', path='css/admin.css')}}">
{% endblock %}
{% block content %}
<section class="admin-section">
  <div class="admin-login-card">
    <h1 class="admin-title">Admin Login</h1>
    <p class="admin-subtitle">Sign in to manage delivery fees</p>

    {% if error %}
    <div class="admin-flash is-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login" class="admin-login-form">
      <label for="admin-password" class="admin-label">Password</label>
      <input type="password" id="admin-password" name="password" class="admin-input"
        autocomplete="current-password" required autofocus>
      <button type="submit" class="admin-btn-primary">Sign In</button>
    </form>
  </div>
</section>
{% endblock %}
